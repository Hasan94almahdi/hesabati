<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f7f7f4">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="حساباتي">
  <meta name="description" content="دفتر حسابات عربي يعمل دون إنترنت لإدارة المال والعملاء والطلبات والديون.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <title>حساباتي 1.0</title>
</head>
<body>
  <div id="app" class="app-shell" aria-live="polite">
    <div class="splash">
      <div class="splash-mark">ح</div>
      <strong>حساباتي</strong>
      <span>يتم تجهيز دفترك…</span>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="update-banner" class="update-banner hidden">
    <span>تحديث جديد جاهز</span>
    <button type="button" id="apply-update">تحديث الآن</button>
  </div>
  <input id="restore-file" type="file" accept="application/json,.json" hidden>
  <script src="./core.js"></script>
  <script src="./db.js"></script>
  <script src="./app.js"></script>
</body>
</html>
